name: build

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish
        run: dotnet publish BreakReminder.csproj -c Release -o out

      - uses: actions/upload-artifact@v4
        with:
          name: BreakReminder
          path: out/BreakReminder.exe
